<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1060" viewBox="0 0 1100 1060" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">AI Company MVP system architecture</title>
  <desc id="archDesc">A Next.js frontend talks to a single Go server binary over REST and SSE. The binary contains a REST API, a concurrent DAG orchestrator that enqueues node executions, an agent runtime with lease-claimed workers plus CLI and API adapters, GitHub and Jira integration services, and Postgres. Postgres is the only durable store. The server spawns git worktrees only as the working directory for agent CLI processes and never reads their contents back. GitHub, Jira and the model providers are external systems reached through webhooks, polling and outbound API calls.</desc>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; }
    .head { fill: #64748b; stroke: none; }
    .t { font-size: 16.5px; font-weight: 600; fill: #0f172a; }
    .t-lg { font-size: 19px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .fine { font-size: 12px; fill: #64748b; }
    .label { font-size: 12.5px; fill: #475569; }
    .cap { font-size: 11px; font-weight: 600; fill: #64748b; letter-spacing: 0.08em; }
  </style>

  <rect x="0.75" y="0.75" width="1098.5" height="1058.5" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ============ Frontend ============ -->
  <rect x="40" y="44" width="960" height="128" rx="12" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="68" y="80" font-size="18" font-weight="600" fill="#312e81">Next.js frontend</text>
  <text x="68" y="101" font-size="12" fill="#6366f1">owner + invited teammates</text>

  <g font-size="12.5" fill="#3730a3" text-anchor="middle">
    <rect x="68" y="112" width="52" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="94" y="131.5">Tree</text>
    <rect x="128" y="112" width="60" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="158" y="131.5">Board</text>
    <rect x="196" y="112" width="96" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="244" y="131.5">Item detail</text>
    <rect x="300" y="112" width="84" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="342" y="131.5">Run view</text>
    <rect x="392" y="112" width="142" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="463" y="131.5">Checkpoint inbox</text>
    <rect x="542" y="112" width="54" height="30" rx="15" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="569" y="131.5">Chat</text>
  </g>
  <text x="976" y="131.5" font-size="12" fill="#6366f1" text-anchor="end">live updates: SSE /api/events</text>

  <!-- ============ Go server ============ -->
  <rect x="40" y="224" width="960" height="656" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="68" y="262" class="t-lg">Go server</text>
  <text x="172" y="262" font-size="13" fill="#64748b">single binary</text>
  <text x="972" y="262" font-size="12" fill="#64748b" text-anchor="end">all components in one process</text>
  <line x1="68" y1="280" x2="972" y2="280" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- REST API -->
  <rect x="68" y="294" width="152" height="160" rx="10" class="card"/>
  <text x="88" y="356" class="t">REST API</text>
  <text x="88" y="382" font-size="12.5" fill="#64748b">(chi/echo)</text>
  <text x="88" y="408" font-size="11.5" fill="#64748b">tenant-scoped</text>

  <!-- Orchestrator -->
  <rect x="272" y="294" width="228" height="160" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="292" y="336" font-size="16.5" font-weight="600" fill="#1e3a8a">Orchestrator</text>
  <text x="292" y="360" font-size="13" font-weight="600" fill="#1d4ed8">concurrent DAG engine</text>
  <text x="292" y="382" font-size="12" fill="#3b82f6">enqueues node executions</text>
  <text x="292" y="402" font-size="12" fill="#3b82f6">resumes after restart</text>

  <!-- Integration services -->
  <rect x="560" y="294" width="412" height="160" rx="10" class="card"/>
  <text x="584" y="340" class="t">Integration services</text>
  <text x="584" y="368" class="sub">GitHub · Jira</text>
  <text x="584" y="392" class="fine">webhooks in · API out</text>
  <line x1="720" y1="322" x2="720" y2="428" stroke="#e2e8f0" stroke-width="1.5"/>
  <g font-size="11.5" fill="#64748b">
    <text x="740" y="350">PR create · review · merge</text>
    <text x="740" y="372">issue status sync</text>
    <text x="740" y="394">webhook verify</text>
  </g>

  <!-- Agent runtime -->
  <rect x="68" y="488" width="362" height="172" rx="10" class="card"/>
  <text x="92" y="520" class="t">Agent runtime</text>
  <text x="92" y="544" class="sub">queue + workers</text>
  <rect x="296" y="504" width="116" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="354" y="521" font-size="11" fill="#0369a1" text-anchor="middle">lease-claimed</text>

  <rect x="84" y="556" width="160" height="84" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="98" y="578" font-size="12.5" font-weight="600" fill="#0f172a">CLI adapter</text>
  <text x="98" y="600" font-size="11.5" fill="#475569">claude-code</text>
  <text x="98" y="620" font-size="11.5" fill="#475569">codex · aider</text>

  <rect x="256" y="556" width="160" height="84" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="270" y="578" font-size="12.5" font-weight="600" fill="#0f172a">API adapter</text>
  <text x="270" y="600" font-size="11.5" fill="#475569">anthropic</text>
  <text x="270" y="620" font-size="11.5" fill="#475569">openai</text>

  <!-- ============ Store (Postgres) — the only durable store ============ -->
  <rect x="300" y="706" width="520" height="154" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6" stroke-dasharray="7 5"/>

  <rect x="324" y="724" width="472" height="112" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="348" y="754" font-size="16.5" font-weight="600" fill="#0f766e">Store (Postgres)</text>
  <text x="348" y="776" font-size="11.5" fill="#0f766e">the only durable state the product reads back</text>
  <text x="348" y="800" font-size="13" fill="#115e59">domain · activity log · job logs</text>
  <text x="348" y="820" font-size="13" fill="#115e59">memories · secrets metadata</text>
  <text x="772" y="820" font-size="11" fill="#0f766e" text-anchor="end">no file-backed store</text>

  <rect x="320" y="846" width="180" height="26" rx="13" fill="#0f766e"/>
  <text x="410" y="863" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">single durable store</text>

  <!-- ============ Filesystem exception ============ -->
  <rect x="68" y="916" width="362" height="104" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="92" y="944" font-size="16" font-weight="600" fill="#9a3412">git worktrees</text>
  <text x="92" y="964" font-size="11.5" fill="#b45309">agent CLI processes · per-node execution</text>
  <rect x="88" y="972" width="322" height="28" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="98" y="990" font-size="11.5" font-weight="500" fill="#9a3412">filesystem — working dir only, not app storage</text>

  <!-- ============ External systems ============ -->
  <rect x="620" y="916" width="420" height="104" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="644" y="944" class="cap">EXTERNAL SYSTEMS</text>
  <text x="644" y="974" font-size="14.5" font-weight="600" fill="#1e293b">GitHub · Jira</text>
  <text x="644" y="998" font-size="14.5" font-weight="600" fill="#1e293b">Anthropic / OpenAI</text>

  <!-- ============ Edges ============ -->
  <!-- frontend <-> server -->
  <path class="edge" d="M144 172 V214"/>
  <path class="head" d="M138 214 L150 214 L144 224 Z"/>
  <path class="edge" d="M766 224 V182"/>
  <path class="head" d="M760 182 L772 182 L766 172 Z"/>

  <!-- REST -> orchestrator -->
  <path class="edge" d="M220 374 H262"/>
  <path class="head" d="M262 368 L262 380 L272 374 Z"/>

  <!-- orchestrator -> integrations -->
  <path class="edge" d="M500 344 H546"/>
  <path class="head" d="M546 338 L546 350 L556 344 Z"/>

  <!-- orchestrator -> agent runtime (jobs) -->
  <path class="edge" d="M300 454 V478"/>
  <path class="head" d="M294 478 L306 478 L300 488 Z"/>

  <!-- agent runtime / orchestrator / integrations -> store -->
  <path class="edge" d="M350 660 V696"/>
  <path class="head" d="M344 696 L356 696 L350 706 Z"/>
  <path class="edge" d="M470 454 V696"/>
  <path class="head" d="M464 696 L476 696 L470 706 Z"/>
  <path class="edge" d="M620 454 V696"/>
  <path class="head" d="M614 696 L626 696 L620 706 Z"/>

  <!-- agent runtime -> worktrees (spawns), far-left lane clear of the store region -->
  <path class="edge" d="M100 660 V906"/>
  <path class="head" d="M94 906 L106 906 L100 916 Z"/>

  <!-- external systems <-> server: two separate lanes, both clear of the store region -->
  <path class="edge" d="M860 916 V464"/>
  <path class="head" d="M854 464 L866 464 L860 454 Z"/>
  <path class="edge" d="M950 454 V906"/>
  <path class="head" d="M944 906 L956 906 L950 916 Z"/>

  <!-- ============ Edge labels ============ -->
  <text x="455" y="200" class="label" text-anchor="middle">REST + SSE (live run/chat stream)</text>
  <text x="528" y="334" font-size="12" fill="#475569" text-anchor="middle">sync</text>
  <text x="314" y="476" font-size="12.5" fill="#475569">jobs</text>
  <text x="336" y="688" class="label" text-anchor="end">logs · memories</text>
  <text x="484" y="600" class="label">run state</text>
  <text x="634" y="600" class="label">sync state</text>
  <text x="114" y="760" class="label">spawns (cwd only)</text>
  <text x="848" y="500" class="label" text-anchor="end">webhooks (smee/ngrok)</text>
  <text x="848" y="518" class="label" text-anchor="end">/ polling</text>
  <text x="962" y="902" class="label">outbound API calls</text>
</svg>
